name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# pages: write and id-token: write let deploy-pages publish the site.
# id-token is GitHub's OIDC check for Pages. This workflow does not use Deno Deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel a production deploy that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: deno task pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Keep .nojekyll, which is a dotfile.
          include-hidden-files: true

  deploy:
    name: Deploy
    # Pull requests build and upload the artifact only.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
